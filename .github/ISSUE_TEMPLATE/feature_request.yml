name: Feature request
about: Suggest an improvement for QtRNetAnalyzer
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should QtRNetAnalyzer be able to do?
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: Describe the workflow, hardware, file format or analysis task.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the UI/API/build behavior you would prefer.
  - type: textarea
    id: risks
    attributes:
      label: Risks / safety considerations
      description: Especially relevant for CAN TX, R-Net traffic or real wheelchair hardware.
