name: Bug report
about: Report a reproducible QtRNetAnalyzer problem
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include exact commands and logs where possible.
  - type: input
    id: version
    attributes:
      label: Branch / commit
      description: Which branch or commit did you build?
      placeholder: chatgpt / commit hash
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened?
      placeholder: Describe the observed behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include commands, GUI steps and input files where relevant.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: build-log
    attributes:
      label: Build or runtime log
      description: Paste compiler output, Qt messages or terminal logs.
      render: shell
  - type: textarea
    id: environment
    attributes:
      label: Environment
      value: |
        - OS:
        - Qt version:
        - Compiler:
        - CAN driver: waveUSBCAN_b / simulator / other
        - CAN interfaces: output of `ip -details link show type can`
