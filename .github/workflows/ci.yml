name: CI

on:
  push:
    branches:
      - main
      - chatgpt
  pull_request:
    branches:
      - main
      - chatgpt

permissions:
  contents: read

jobs:
  linux-qt6-build:
    name: Linux Qt6 / CMake build
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            qt6-base-dev \
            libgl1-mesa-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DQTRNET_ENABLE_SOCKETCAN=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --verbose
